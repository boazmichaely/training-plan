<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6ff">
  <title>Weekly training</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="weekly-app">
  <main class="weekly-shell">
    <header class="week-header" id="weekHeader">
      <button class="day-arrow" id="previousDay" type="button" aria-label="Previous day">‹</button>
      <div class="day-heading" aria-live="polite">
        <span class="day-name" id="dayName">Loading</span>
        <span class="day-separator">·</span>
        <h1 id="workoutName">Training plan</h1>
      </div>
      <button class="today-button" id="todayButton" type="button">Today</button>
      <button class="day-arrow" id="nextDay" type="button" aria-label="Next day">›</button>
      <button class="icon-button" id="fullscreenButton" type="button" aria-label="Enter full screen" title="Enter full screen" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="fullscreenGlyph" d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m8 0h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
    </header>

    <section class="workspace" id="workspace" aria-live="polite">
      <aside class="session-rail" id="sessionRail">
        <div class="rail-topline"><span class="rail-label">SELECTED WORKOUT</span><span class="session-status"><i class="live-dot"></i><span id="statusText">Ready</span></span><button class="rail-toggle" id="railToggle" type="button" aria-expanded="true" aria-controls="sessionRail" aria-label="Collapse side panel" title="Collapse side panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M20 6l-6 6 6 6"/></svg></button></div>
        <div class="set-summary"><span id="railDay">MONDAY</span><strong id="workoutNameRail">Everyday activity</strong><span class="workout-summary" id="workoutSummary"></span></div>
        <p class="workout-description" id="workoutDescription"></p>
        <div class="session-controls">
          <button class="button button-start" id="startButton" type="button"><span aria-hidden="true">▶</span> Start module</button>
          <button class="button button-done" id="doneButton" type="button" hidden>Done <span aria-hidden="true">✓</span></button>
          <div class="timer-panel" id="timerPanel" hidden>
            <span class="timer-label">SESSION TIMER</span>
            <strong id="timerDisplay">00:00</strong>
            <span class="timer-started" id="timerStarted"></span>
          </div>
        </div>
        <div class="rail-divider"></div>
        <div class="module-list-head"><span class="rail-label">IN THIS WORKOUT</span><span class="module-count"><strong id="moduleNumber">01</strong> / <span id="moduleTotal">03</span></span></div>
        <nav class="module-list" id="moduleList" aria-label="Modules in this workout"></nav>
        <div class="rail-bottom">
          <div class="set-progress"><span id="progressFill"></span></div>
          <div class="rail-actions">
            <button class="rail-nav" id="backButton" type="button" aria-label="Previous module">← Back</button>
            <button class="rail-nav" id="nextButton" type="button" aria-label="Next module">Next →</button>
          </div>
          <button class="log-button" id="logToggle" type="button"><span>Session log</span><span class="log-count" id="logCount">0</span></button>
        </div>
      </aside>

      <article class="module-view" id="moduleView">
        <div class="module-heading">
          <span class="module-category"><span id="moduleCategory">LOADING</span><span class="module-id" id="moduleId">01-warmup</span></span>
          <span class="duration-tag" id="moduleDuration"></span>
        </div>
        <h2 class="module-title" id="moduleTitle">Loading your training…</h2>
        <div class="module-content" id="moduleContent">
          <div class="module-copy">
            <section class="instructions-pane" aria-label="Module instructions">
              <div class="instructions-label">INSTRUCTIONS</div>
              <div class="markdown-content" id="moduleInstructions"></div>
            </section>
          </div>
          <div class="module-visual" id="visualColumn">
            <img class="module-image" id="moduleImage" alt="" hidden>
            <div class="visual-placeholder" id="visualPlaceholder" aria-hidden="true"><span id="visualIndex">01</span><i></i></div>
          </div>
        </div>
      </article>
    </section>
  </main>

  <dialog id="logDialog" class="log-dialog">
    <div class="dialog-head"><div><span class="module-category">YOUR PRACTICE</span><h2>Session log</h2></div><button class="close-button" id="closeLog" type="button" aria-label="Close log">×</button></div>
    <div id="logEntries" class="log-entries"></div>
    <div class="dialog-foot"><span>Saved on this device</span><button id="clearLog" class="text-button" type="button">Clear log</button></div>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
