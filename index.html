<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b22">
  <title>Training modules</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Training modules home"><span class="brand-mark">T</span><span>FIELDNOTES <small>TRAINING</small></span></a>
      <div class="session-status"><span class="live-dot"></span><span id="statusText">Ready when you are</span></div>
      <button class="text-button" id="logToggle" type="button">Session log <span id="logCount">0</span></button>
    </header>

    <section class="stage" aria-live="polite">
      <aside class="rail">
        <div class="rail-label">YOUR SESSION</div>
        <div class="progress-track"><div id="progressFill"></div></div>
        <div class="module-count"><strong id="moduleNumber">01</strong><span> / <span id="moduleTotal">00</span></span></div>
        <div class="rail-caption">MODULE</div>
        <div class="module-dots" id="moduleDots" aria-label="Module progress"></div>
      </aside>

      <article class="module-card" id="moduleCard">
        <div class="card-topline"><span class="eyebrow" id="moduleCategory">LOADING MODULES</span><span class="duration-tag" id="moduleDuration"></span></div>
        <div class="card-content">
          <div class="copy-column">
            <h1 id="moduleTitle">Loading your training…</h1>
            <p class="intro" id="moduleDescription"></p>
            <div class="focus-box" id="focusBox"><span class="focus-icon">✳</span><div><span class="focus-label">YOUR FOCUS</span><p id="moduleFocus"></p></div></div>
            <div class="timer-panel" id="timerPanel" hidden>
              <span class="timer-label"><span class="live-dot"></span> SESSION TIMER</span>
              <strong id="timerDisplay">00:00</strong>
              <span class="timer-started" id="timerStarted"></span>
            </div>
          </div>
          <div class="visual-column" id="visualColumn" aria-hidden="true"><div class="orb orb-one"></div><div class="orb orb-two"></div><div class="visual-lines"></div><div class="visual-index" id="visualIndex">01</div><div class="visual-caption">SHOW UP<br>WITH INTENTION</div></div>
        </div>
        <div class="card-bottom"><div class="controls-left"><button class="nav-button" id="backButton" type="button" aria-label="Previous module">← <span>Back</span></button><span class="key-hint">← / → to navigate</span></div><div class="controls-right"><button class="button button-quiet" id="startButton" type="button"><span class="play-icon">▶</span> Start</button><button class="button button-primary" id="doneButton" type="button" hidden>Done <span>✓</span></button><button class="nav-button next-button" id="nextButton" type="button" aria-label="Next module"><span>Next</span> →</button></div></div>
      </article>
    </section>
    <footer><span>TAKE IT ONE MODULE AT A TIME.</span><span id="footerDate"></span></footer>
  </main>

  <dialog id="logDialog" class="log-dialog">
    <div class="dialog-head"><div><span class="eyebrow">YOUR PRACTICE</span><h2>Session log</h2></div><button class="close-button" id="closeLog" aria-label="Close log">×</button></div>
    <div id="logEntries" class="log-entries"></div>
    <div class="dialog-foot"><span>Saved on this device</span><button id="clearLog" class="text-button" type="button">Clear log</button></div>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
